plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

android {
    namespace "com.example.face_scan_android"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.face_scan_android"
        // google_mlkit_face_detection / camerax require 21+; tflite_flutter is fine.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

// tflite_flutter 0.11.0 pulls in tensorflow-lite, tensorflow-lite-gpu and
// tensorflow-lite-api, all of which declare the namespace org.tensorflow.lite.
// AGP 9 rejects duplicate namespaces across libraries. The app only uses the
// CPU interpreter (libtensorflowlite_jni.so) via FFI, so drop the GPU + API
// artifacts from the app classpath.
configurations.configureEach {
    exclude group: 'org.tensorflow', module: 'tensorflow-lite-gpu'
    exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
}

flutter {
    source '../..'
}
